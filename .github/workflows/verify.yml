# The gates, on a machine that is not a developer's laptop.
#
# Runs `npm run verify` — build, cargo test, the window's tests and type check, package,
# the manual-vs-manifest check, the negative smoke test and the CLI ⇄ GUI round-trip — on
# every push and pull request. macOS only, because `launch.macos` is the only platform the
# manifest promises (format.md § Which platforms you owe).
#
# Three things this runner proves that a laptop cannot:
#
#   * TZ=UTC. The core computes due dates in local time, and the regression that guards
#     against is invisible on a machine in +03. The job asserts the zone before trusting it.
#   * No ssh key. `cargo fetch --locked` runs on a runner that has no key and no stored
#     token, so a dependency that reached for one fails right there (playbook §8). The job
#     asserts the absence rather than assuming it.
#   * No secret. Nothing below reads `secrets.*`. clappkit is a public submodule over
#     HTTPS, and the checkout drops its token before any build step runs.
#
# One step is NOT run here: `clatch validate`. Clatch is a private launcher with no public
# binary, so the job sets VERIFY_WITHOUT_CLATCH=1 and verify.sh logs a warning in its
# place. `clatch validate` and the real install remain local gates before any release.
name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 45
    env:
      TZ: UTC
      VERIFY_WITHOUT_CLATCH: '1'
      # Service containers are Linux-only; the `server` job below runs those tests.
      VERIFY_WITHOUT_SERVER: '1'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive # clappkit — public over HTTPS, so no token
          persist-credentials: false # nothing later can borrow the checkout's token

      - name: Assert the clock is UTC
        run: |
          set -eu
          echo "TZ=$TZ"
          offset=$(date +%z)
          zone=$(node -e 'process.stdout.write(Intl.DateTimeFormat().resolvedOptions().timeZone)')
          echo "date +%z: $offset   node: $zone"
          [ "$offset" = "+0000" ] || { echo "::error::the job's clock is $offset, not UTC"; exit 1; }
          case "$zone" in UTC|Etc/UTC) ;; *) echo "::error::node resolves $zone, not UTC"; exit 1 ;; esac

      - name: Assert there is no ssh key
        run: |
          set -u
          found=$(ls ~/.ssh/id_* 2>/dev/null || true)
          [ -z "$found" ] || { echo "::error::ssh keys present: $found"; exit 1; }
          if [ -n "${SSH_AUTH_SOCK:-}" ] && ssh-add -l >/dev/null 2>&1; then
            echo "::error::an ssh agent is holding keys"; exit 1
          fi
          if git config --get-regexp 'http\..*extraheader' ; then
            echo "::error::git still carries an auth header"; exit 1
          fi
          echo "no ssh key, no agent identity, no git auth header"

      - uses: actions/setup-node@v5
        with:
          node-version: '24' # `node --test` with a glob and type stripping, as used locally
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # THE proof that nothing private is reachable. Not `--offline`: that also forbids
      # crates.io, which a fresh runner has never downloaded. It runs BEFORE the
      # cache restore, so ~/.cargo is empty and a git dependency cannot answer from cache.
      - name: cargo fetch --locked (no key)
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      # A failed run still saves its cache, so the next attempt does not start from zero
      # (playbook §9).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      - name: npm run verify
        run: npm run verify

  # The server's tests against a real PostgreSQL. A `services:` container is Linux-only,
  # so this is its own job rather than a step in the macOS one. It runs the very script
  # `npm run verify` runs locally, so there is one recipe, not two.
  #
  # Until p2-backend lands there is no server/ and server-test.sh says so in a warning;
  # the database check below still proves the service is reachable, so the wiring is
  # tested before the first server test exists.
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      CARGO_TERM_COLOR: always
      # A throwaway database for this job only. The password protects nothing: the
      # container is unreachable from outside the runner and dies with it.
      DATABASE_URL: postgres://postgres:ci-throwaway@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: PostgreSQL answers
        run: psql "$DATABASE_URL" -tAc 'select version()'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-on-failure: true

      - name: Server tests
        run: bash scripts/server-test.sh

  # The container image and the compose file, built and run for real (p3 §4). Nothing else in
  # this project has Docker, so this job is the only evidence the deploy files work at all.
  # It deploys nothing: the stack lives for this job and is removed at the end.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Throwaway, for this job's containers only. Not a secret, and not reused anywhere.
      POSTGRES_PASSWORD: ci-throwaway-0123456789abcdef
      COMPOSE: docker compose -f deploy/compose.yaml
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # the server needs crates/ and server/, not clappkit

      - name: The compose file is valid, and refuses to start without a password
        run: |
          $COMPOSE config --quiet
          if env -u POSTGRES_PASSWORD $COMPOSE config --quiet 2>/dev/null; then
            echo "::error::compose accepted a missing POSTGRES_PASSWORD"; exit 1
          fi

      - name: Build the image and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 240

      - name: The server answers, and refuses an unauthenticated caller
        run: |
          test "$(curl -fsS http://127.0.0.1:8787/healthz)" = ok
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/me)
          echo "GET /v1/me with no session -> $code"
          test "$code" = 401

      - name: It migrated its own database
        run: |
          n=$($COMPOSE exec -T db psql -U crm -d crm -tAc 'select count(*) from _migrations')
          echo "migrations applied: $n"
          test "$n" -ge 1

      - name: The container runs as nobody in particular
        run: |
          uid=$($COMPOSE exec -T server id -u)
          echo "uid in the server container: $uid"
          test "$uid" != 0

      - name: PostgreSQL is not published to the host
        run: |
          # `compose port` prints ":0" for a port that is not published, so ":0" and empty are "no".
          mapped=$($COMPOSE port db 5432 2>/dev/null || true)
          echo "compose port db 5432 -> '${mapped}'"
          case "$mapped" in ""|":0") ;; *) echo "::error::the database port is published: $mapped"; exit 1 ;; esac
          ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null

      - name: The live-updates stream (informational until the endpoint exists)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/sync/stream)
          if [ "$code" = 404 ]; then
            echo "::notice title=stream not on this server yet::/v1/sync/stream answers 404, so X-Accel-Buffering is not checked."
          else
            echo "/v1/sync/stream answers $code without a session; its X-Accel-Buffering header needs a session to read and is checked by the server's own tests."
          fi

      - name: Logs, if anything above failed
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Tear down (containers and volume)
        if: always()
        run: $COMPOSE down -v

  # win1: the same code, on a real Windows runner, never cross-compiled. It does not take the
  # macOS round-trip (there is no window to open on a runner); it builds, tests and packages,
  # then proves what only Windows gets wrong — crm.exe is a CONSOLE program that waits and
  # prints (scripts/check-cli.sh; clappkit/src/role.rs explains the trap). `clatch validate`
  # needs Clatch, which no runner has: it runs on a Windows machine that does, as on macOS.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash # Git Bash: scripts/*.sh run unchanged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive # clappkit — public over HTTPS, so no token
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: The host toolchain is MSVC
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p'); echo "host: $host"
          case "$host" in *-msvc) ;; *) echo "::error::$host links WebView2Loader.dll dynamically"; exit 1 ;; esac

      - name: Stop Defender scanning the build
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}","$env:USERPROFILE\.cargo","$env:USERPROFILE\.rustup" -ErrorAction SilentlyContinue

      # The keyless proof, before the cache restore: no ssh key exists on this runner either.
      - name: cargo fetch --locked (no key)
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      # `npm run <script>` spawns cmd.exe on Windows, which cannot run a .sh file.
      - name: Use bash for npm scripts
        run: npm config set script-shell bash

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: npm test
        run: npm test

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: Build with npm run build (a bare cargo build gives a white window)
        run: npm run build

      - name: Package
        run: bash scripts/package.sh

      - name: The packaged binary is x86-64 and a console program
        run: bash scripts/assert-binary-arch.sh pkg x86_64

      - name: crm.exe -h prints the manual and exits 0; a bad flag exits 2
        run: bash scripts/check-cli.sh pkg

      - name: clatch validate is not run here
        run: echo "::warning title=clatch validate not run on Windows CI::No runner has Clatch. Run 'clatch validate pkg' on a Windows machine that does, before any release."
